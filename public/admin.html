/* Admin console micro-interactions */
.panel,.stat,.table-wrap{animation:admin-rise .32s cubic-bezier(.2,.75,.25,1) both}
.btn,.navbtn,button{transition:transform .18s ease,background-color .18s ease,border-color .18s ease,box-shadow .18s ease}
.btn:not(:disabled):hover,.navbtn:hover{transform:translateY(-1px)}
.btn:not(:disabled):active{transform:scale(.985)}
@keyframes admin-rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.panel,.stat,.table-wrap{animation:none!important}.btn,.navbtn,button{transition:none!important}}
