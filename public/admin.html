<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#150b2b"><title>Prime Trust · Admin Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#10091f;--panel:#1b1230;--line:#35284d;--fg:#f8f5ff;--muted:#a99dbd;--accent:#b7a0ff;--good:#7bd3c1;--bad:#ff8c9b;--warn:#f4c879}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0,#352052 0,transparent 42%),var(--bg);color:var(--fg);font:14px Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}main{max-width:1440px;margin:auto;padding:24px 18px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px}.brand{font:700 21px "Space Grotesk";letter-spacing:-.6px}.brand small{color:var(--muted);font:500 12px Inter}.topright{display:flex;align-items:center;gap:10px}.pill{border:1px solid var(--line);border-radius:999px;padding:8px 12px;color:var(--muted);font-size:11px}.workspace{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;align-items:start}.sidebar{position:sticky;top:14px;background:rgba(27,18,48,.82);border:1px solid var(--line);border-radius:20px;padding:10px;display:grid;gap:5px}.navbtn{border:0;border-radius:12px;background:transparent;color:var(--muted);padding:12px;text-align:left;display:flex;gap:10px;align-items:center;font-weight:600;font-size:12px}.navbtn:hover,.navbtn.active{background:rgba(183,160,255,.12);color:var(--accent)}.navbtn .navico{width:20px;text-align:center;font-size:16px}.navbtn .count{margin-left:auto;background:#392c51;border-radius:8px;padding:3px 7px;font-size:10px}.content{min-width:0}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:2px 0 18px}.pagehead h1{font:700 clamp(25px,3vw,34px) "Space Grotesk";letter-spacing:-1px;margin:0}.pagehead p{color:var(--muted);margin:7px 0 0;line-height:1.5}.panel{background:rgba(27,18,48,.88);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 20px 60px #0002}.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:14px}.stat{min-width:0}.stat label{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}.stat strong{font:700 26px "Space Grotesk";display:block;overflow-wrap:anywhere}.stat small{color:var(--muted);font-size:11px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.space{justify-content:space-between}.muted{color:var(--muted)}.small{font-size:11px}.title2{font:600 17px "Space Grotesk";margin:0 0 14px}.btn{border:1px solid var(--line);background:#2b2040;color:var(--fg);border-radius:11px;padding:10px 13px;font-size:12px;font-weight:600}.btn:hover{border-color:#74609d}.primary{background:var(--accent);border-color:var(--accent);color:#1a1030}.good{background:#234c43;border-color:#326a5e;color:#a6f1df}.danger{background:#542a3a;border-color:#744151;color:#ffc1ca}.ghost{background:transparent}.field{display:grid;gap:6px;font-size:11px;color:#d9d0e8;font-weight:600}.field input,.field select,.field textarea,input.search,select.filter,textarea{width:100%;border:1px solid #493960;background:#10091f;color:var(--fg);border-radius:11px;padding:11px;outline:none}.field textarea,textarea{resize:vertical;min-height:90px}.field input:focus,.field select:focus,.field textarea:focus,input.search:focus{border-color:var(--accent)}.form{display:grid;gap:12px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toolbar .searchwrap{flex:1;min-width:190px}.search{min-width:0}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:600px}.table th,.table td{text-align:left;padding:12px 10px;border-bottom:1px solid #ffffff0d;font-size:12px;vertical-align:middle}.table th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em}.table tr:last-child td{border-bottom:0}.table tr[data-open]{cursor:pointer}.table tr[data-open]:hover td{background:#ffffff05}.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:10px;text-transform:capitalize;color:var(--muted)}.badge.active,.badge.approved,.badge.completed{color:var(--good);border-color:#326a5e;background:#234c4322}.badge.pending,.badge.submitted{color:var(--warn);border-color:#755b34;background:#755b3422}.badge.suspended,.badge.rejected,.badge.closed{color:var(--bad);border-color:#744151;background:#74415122}.customer{display:flex;align-items:center;gap:10px;min-width:170px}.avatar{width:36px;height:36px;display:grid;place-items:center;border-radius:12px;background:#b7a0ff1c;color:var(--accent);font-weight:700;flex:none}.customer b{display:block;font-size:12px}.customer small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.empty{padding:30px;text-align:center;color:var(--muted)}.alert{border:1px solid #755b34;background:#755b3422;color:var(--warn);padding:12px;border-radius:12px;font-size:12px;margin-bottom:12px}.section{margin-top:14px}.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid #ffffff0d;font-size:12px}.kv:last-child{border-bottom:0}.kv span{color:var(--muted)}.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.tab{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:10px;padding:8px 11px;font-size:11px}.tab.active{background:#b7a0ff1a;border-color:#75609d;color:var(--accent)}.kyccard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;margin-bottom:10px}.kyccard h3{margin:0 0 6px;font:600 15px "Space Grotesk"}.kyccard dl{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px;font-size:12px;margin:12px 0}.kyccard dt{color:var(--muted)}.kyccard dd{margin:0;overflow-wrap:anywhere}.actions{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:120px}.actions textarea{min-height:70px;width:180px;font-size:11px}.chatlayout{display:grid;grid-template-columns:290px minmax(0,1fr);height:600px;min-height:400px;overflow:hidden;padding:0}.chatlist{border-right:1px solid var(--line);overflow:auto}.chatitem{display:block;width:100%;border:0;border-bottom:1px solid #ffffff0c;background:transparent;color:var(--fg);padding:14px;text-align:left}.chatitem.active,.chatitem:hover{background:#b7a0ff12}.chatitem b{display:block;font-size:12px}.chatitem small{display:block;color:var(--muted);font-size:10px;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chatpane{display:flex;flex-direction:column;min-width:0}.chathead{padding:14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}.messages{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}.bubble{max-width:82%;padding:11px 13px;border-radius:14px;background:#2b2040;font-size:12px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.admin{align-self:flex-end;background:#42335d}.bubble small{display:block;color:var(--muted);font-size:9px;margin-top:6px}.chatcompose{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}.chatcompose textarea{min-height:45px;max-height:120px;flex:1}.hidden{display:none!important}.loginwrap{max-width:480px;margin:8vh auto}.loginwrap form{display:grid;gap:14px}.error{color:var(--bad);font-size:12px;min-height:18px}.notice{padding:12px;border-radius:12px;background:#234c4322;border:1px solid #326a5e;color:var(--good);font-size:12px;margin:12px 0}.mobilebar{display:none}.docmodal{position:fixed;inset:0;z-index:999;background:#090510e8;display:grid;place-items:center;padding:14px;overflow:auto}.docpanel{width:min(900px,100%);max-height:94vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px}.docimage{display:grid;gap:10px;margin:16px 0;padding:14px;border:1px solid var(--line);border-radius:14px}.docimage h3{margin:0;font:600 14px 'Space Grotesk'}.docimage img{max-width:100%;max-height:65vh;object-fit:contain;justify-self:center;border-radius:10px;background:#fff}.footerhint{font-size:10px;color:var(--muted);margin-top:14px;line-height:1.5}
@media(max-width:900px){.workspace{grid-template-columns:1fr}.sidebar{position:static;display:flex;overflow:auto;white-space:nowrap;border-radius:14px}.navbtn{flex:none}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.chatlayout{grid-template-columns:230px minmax(0,1fr)}}
@media(max-width:600px){main{padding:15px 10px 40px}.top{margin-bottom:14px}.brand{font-size:18px}.pill{display:none}.stats{gap:8px}.stat strong{font-size:22px}.panel{padding:13px;border-radius:15px}.two,.three,.split{grid-template-columns:1fr}.kyccard{grid-template-columns:1fr}.actions{flex-direction:row;flex-wrap:wrap}.actions textarea{width:100%}.chatlayout{grid-template-columns:1fr;height:70vh}.chatlist{border-right:0;border-bottom:1px solid var(--line);max-height:180px}.chatitem{padding:10px}.chatpane{min-height:0}.kv{grid-template-columns:110px minmax(0,1fr)}}

/* Admin console micro-interactions */
.panel,.stat,.table-wrap{animation:admin-rise .32s cubic-bezier(.2,.75,.25,1) both}
.btn,.navbtn,button{transition:transform .18s ease,background-color .18s ease,border-color .18s ease,box-shadow .18s ease}
.btn:not(:disabled):hover,.navbtn:hover{transform:translateY(-1px)}
.btn:not(:disabled):active{transform:scale(.985)}
@keyframes admin-rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.panel,.stat,.table-wrap{animation:none!important}.btn,.navbtn,button{transition:none!important}}
</style></head><body><main>
<header class="top"><div><div class="brand">Prime Trust <small>/ ADMIN CONSOLE</small></div><div class="muted small" style="margin-top:4px">Customer operations & account oversight</div></div><div class="topright"><span class="pill">Secure administrator session</span><button id="logout" class="btn ghost hidden">Sign out</button></div></header>
<section id="login" class="panel loginwrap"><h1 style="font:700 30px 'Space Grotesk';margin:0 0 8px">Administrator sign in</h1><p class="muted" style="line-height:1.6">Sign in to manage customer accounts, identity reviews, transactions and support.</p><form id="loginForm"><label class="field">Admin email<input name="email" type="email" required autocomplete="username"></label><label class="field">Password<input name="password" type="password" required autocomplete="current-password"></label><div class="error" id="loginErr"></div><button class="btn primary">Sign in securely</button></form></section>
<section id="workspace" class="workspace hidden"><nav class="sidebar" id="nav">
<button class="navbtn active" data-page="overview"><span class="navico">▦</span>Overview</button>
<button class="navbtn" data-page="users"><span class="navico">♙</span>Customers</button>
<button class="navbtn" data-page="kyc"><span class="navico">✓</span>Identity review<span class="count" id="kycCount">0</span></button>
<button class="navbtn" data-page="transactions"><span class="navico">↔</span>Transactions</button>
<button class="navbtn" data-page="disputes"><span class="navico">!</span>Disputes</button>
<button class="navbtn" data-page="chat"><span class="navico">◌</span>Support chat<span class="count" id="chatCount">0</span></button>
<button class="navbtn" data-page="email"><span class="navico">✉</span>Mail centre</button>
<button class="navbtn" data-page="audit"><span class="navico">≡</span>Admin activity</button>
</nav><div class="content" id="content"></div></section>
</main><script src="/admin.js?v=admin-novacrest-copy-07"></script></body></html>
